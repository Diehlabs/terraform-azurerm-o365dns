name: Terraform Module Build
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Terratest is not run here: these tests apply real resources and need
# provider credentials. Use terraform-module.yml for modules that can run it.
jobs:
  terrascan:
    permissions:
      contents: read
      security-events: write
    uses: Diehlabs/shared-workflows/.github/workflows/terrascan.yml@main

  release:
    needs: [terrascan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: Diehlabs/shared-workflows/.github/workflows/github-release.yml@main
